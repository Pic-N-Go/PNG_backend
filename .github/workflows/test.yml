name: Pic-N-Go Backend PR Test

# develop/main으로 가는 PR마다 전체 테스트를 돌린다.
# 배포 워크플로(deploy.yml)는 -x test로 테스트를 건너뛰므로, 테스트 관문은 여기서만 걸린다.
on:
  pull_request:
    branches:
      - develop
      - main

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 테스트 DB는 H2(메모리)라 MySQL은 필요 없다.
    # Redis·RabbitMQ는 application-test.yml이 localhost 기본 포트를 바라보므로 컨테이너로 띄운다.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 1. 레포지토리 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. JDK 21 (Temurin) 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. 전체 테스트 실행
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 PR 화면에서 내려받아 볼 수 있게 리포트를 남긴다.
      - name: 4. 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
