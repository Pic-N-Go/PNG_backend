version: '3.8'

services:
  png-redis:
    image: redis:7-alpine
    container_name: png-redis
    ports:
      - "6379:6379"
    restart: always

  png-rabbitmq:
    image: rabbitmq:3-management
    container_name: png-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  png-prometheus:
    image: prom/prometheus:latest
    container_name: png-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  png-grafana:
    image: grafana/grafana:latest
    container_name: png-grafana
    ports:
      - "8081:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - png-prometheus
    restart: always