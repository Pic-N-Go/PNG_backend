version: '3.8'

services:
  png-redis:
    image: redis:7-alpine
    container_name: png-redis
    ports:
      - "6379:6379"
    restart: always

  png-rabbitmq:
    image: rabbitmq:3-management
    container_name: png-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  png-mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: png-mysqld-exporter
    restart: always
    command:
      - "--mysqld.address=host.docker.internal:3306"
      - "--mysqld.username=root"
      - "--collect.info_schema.innodb_metrics"
      - "--collect.perf_schema.eventsstatements"
      - "--collect.perf_schema.eventsstatements.limit=50"
      - "--collect.perf_schema.eventsstatements.digest_text_limit=120"
      - "--collect.perf_schema.tablelocks"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_PASSWORD:-1234}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  png-prometheus:
    image: prom/prometheus:latest
    container_name: png-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  png-grafana:
    image: grafana/grafana:latest
    container_name: png-grafana
    ports:
      - "8082:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # monitoring/grafana/provisioning 의 알림 설정이 읽는 값
      - PROMETHEUS_URL=http://png-prometheus:9090
      # 로컬은 앱이 꺼져 있는 때가 많아 실제 채널로 보내면 "서버 다운"이 계속 울린다.
      # 그래서 운영용 DISCORD_WEBHOOK_URL을 읽지 않고, 전송 테스트가 필요할 때만 LOCAL_DISCORD_WEBHOOK_URL을 채운다.
      # 비어 있으면 보내지지 않는 가짜 주소를 써서 알림 설정 로딩만 성공시킨다.
      - DISCORD_WEBHOOK_URL=${LOCAL_DISCORD_WEBHOOK_URL:-https://discord.invalid/local-alerts-disabled}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - png-prometheus
    restart: always