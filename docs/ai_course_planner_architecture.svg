<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .subtitle-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 500; fill: #64748B; }
      .section-header { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: -0.2px; }
      .card-title { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .card-subtitle { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; }
      .body-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; font-weight: 400; fill: #64748B; line-height: 1.4; }
      .badge-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 9.5px; font-weight: 700; }
      .arrow-label { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 9.5px; font-weight: 600; fill: #475569; }
      .code-font { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; }
    </style>

    <filter id="card-shadow" x="-4%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>
    <filter id="container-shadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0D9488" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="680" fill="#F8FAFC" rx="16" />

  <!-- Top Title Bar -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="title-text">AI 맞춤형 출사 코스 플래너 아키텍처</text>
    <text x="0" y="22" class="subtitle-text">Spring Boot 네이티브 멀티 에이전트 오케스트레이션 및 RabbitMQ 기반 비동기 파이프라인</text>
  </g>

  <!-- 1. Client & API Section (Left Column) -->
  <g transform="translate(40, 85)">
    <!-- Container -->
    <rect width="200" height="545" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#container-shadow)" />
    <rect width="200" height="34" rx="12" fill="#F1F5F9" />
    <rect width="200" height="12" y="22" fill="#F1F5F9" />
    <text x="14" y="22" class="section-header">1. 클라이언트 &amp; 인그레스</text>

    <!-- Mobile Client Card -->
    <g transform="translate(14, 48)">
      <rect width="172" height="110" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <rect x="8" y="8" width="68" height="18" rx="4" fill="#E2E8F0" />
      <text x="14" y="21" class="badge-text" fill="#334155">모바일 앱</text>
      <text x="8" y="44" class="card-title">React Native (Expo)</text>
      <text x="8" y="62" class="body-text">자연어 출사 요청 입력</text>
      <rect x="8" y="72" width="156" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="14" y="88" class="code-font" fill="#475569">"충남 서해 1박2일..."</text>
    </g>

    <!-- Request Arrow -->
    <path d="M 100 168 L 100 196" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)" />
    <text x="106" y="186" class="arrow-label" fill="#2563EB">POST 요청</text>

    <!-- API Controller Card -->
    <g transform="translate(14, 204)">
      <rect width="172" height="135" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" filter="url(#card-shadow)" />
      <rect x="8" y="8" width="94" height="18" rx="4" fill="#DBEAFE" />
      <text x="14" y="21" class="badge-text" fill="#1D4ED8">CourseController</text>
      <text x="8" y="44" class="card-title">POST /api/v1/courses/ai-plan</text>
      <text x="8" y="62" class="body-text">비동기 큐 전환 및 즉시 반환</text>
      <rect x="8" y="74" width="156" height="48" rx="4" fill="#FFFFFF" stroke="#DBEAFE" />
      <text x="14" y="90" class="code-font" fill="#1E40AF">202 Accepted (50ms)</text>
      <text x="14" y="106" class="code-font" fill="#64748B">taskId: "uuid-xxxx"</text>
    </g>

    <!-- Return to Client Path -->
    <path d="M 14 260 C -10 260, -10 100, 14 100" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-blue)" />
    <text x="-12" y="180" class="arrow-label" fill="#2563EB" transform="rotate(-90, -12, 180)">즉시 응답 반환</text>

    <!-- Deep Link Arrival Card -->
    <g transform="translate(14, 405)">
      <rect width="172" height="115" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" filter="url(#card-shadow)" />
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#DCFCE7" />
      <text x="14" y="21" class="badge-text" fill="#15803D">완료 시 화면 진입</text>
      <text x="8" y="44" class="card-title">코스 상세 (CoursePlan)</text>
      <text x="8" y="62" class="body-text">FCM 푸시 알림 탭 수신</text>
      <text x="8" y="76" class="body-text">딥링크: /courses/:planId</text>
      <text x="8" y="94" class="body-text" fill="#15803D" font-weight="600">지도 경로선 &amp; AI 가이드 로드</text>
    </g>
  </g>

  <!-- Arrow: API Controller to Message Queue -->
  <path d="M 240 320 L 272 320" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="244" y="312" class="arrow-label" fill="#7C3AED">Enqueue</text>

  <!-- 2. Async Queue Section -->
  <g transform="translate(280, 85)">
    <!-- Container -->
    <rect width="150" height="545" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#container-shadow)" />
    <rect width="150" height="34" rx="12" fill="#F5F3FF" />
    <rect width="150" height="12" y="22" fill="#F5F3FF" />
    <text x="14" y="22" class="section-header" fill="#6B21A8">2. 비동기 메시징</text>

    <!-- Producer Card -->
    <g transform="translate(12, 140)">
      <rect width="126" height="64" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
      <text x="8" y="24" class="card-subtitle" fill="#6B21A8">AiCoursePlanProducer</text>
      <text x="8" y="44" class="body-text">메시지 직렬화 및 전송</text>
    </g>

    <path d="M 75 204 L 75 240" fill="none" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arrow-purple)" />

    <!-- RabbitMQ Queue Card -->
    <g transform="translate(12, 248)">
      <rect width="126" height="90" rx="6" fill="#7C3AED" stroke="#6D28D9" stroke-width="1" filter="url(#card-shadow)" />
      <text x="10" y="24" class="card-title" fill="#FFFFFF">RabbitMQ 큐</text>
      <text x="10" y="44" class="code-font" fill="#EDE9FE">course.ai.plan.queue</text>
      <line x1="10" y1="52" x2="116" y2="52" stroke="#A78BFA" stroke-width="0.8" />
      <text x="10" y="68" class="body-text" fill="#DDD6FE">스레드 풀 고갈 방지</text>
      <text x="10" y="80" class="body-text" fill="#DDD6FE">트래픽 완충 (Buffer)</text>
    </g>

    <path d="M 75 338 L 75 374" fill="none" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arrow-purple)" />

    <!-- Consumer Card -->
    <g transform="translate(12, 382)">
      <rect width="126" height="64" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
      <text x="8" y="24" class="card-subtitle" fill="#6B21A8">AiCoursePlanConsumer</text>
      <text x="8" y="44" class="body-text">메시지 수신 및 워커 실행</text>
    </g>
  </g>

  <!-- Arrow: Consumer to Multi-Agent Engine -->
  <path d="M 430 414 L 464 414" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)" />
  <text x="432" y="406" class="arrow-label" fill="#0D9488">Invoke</text>

  <!-- 3. Spring Boot Native Multi-Agent Orchestration (Center Box) -->
  <g transform="translate(470, 85)">
    <!-- Container -->
    <rect width="385" height="545" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.8" filter="url(#container-shadow)" />
    <rect width="385" height="34" rx="12" fill="#F0FDFA" />
    <rect width="385" height="12" y="22" fill="#F0FDFA" />
    <text x="16" y="22" class="section-header" fill="#0F766E">3. Spring Boot 네이티브 멀티 에이전트 오케스트레이션</text>

    <!-- Top: LeaderAgent -->
    <g transform="translate(20, 48)">
      <rect width="345" height="100" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.2" filter="url(#card-shadow)" />
      <rect x="10" y="8" width="80" height="18" rx="4" fill="#CCFBF1" />
      <text x="16" y="21" class="badge-text" fill="#0F766E">오케스트레이터</text>
      <text x="100" y="22" class="card-title">LeaderAgent (의도 분석 &amp; 목표 수립)</text>
      
      <text x="12" y="46" class="body-text">• 자연어 질의 분석 (GPT-4o JSON Mode)</text>
      <text x="12" y="60" class="body-text">• N박 M일 기간 파싱 (1~7일 durationDays 추출 및 비례 스팟수 산출)</text>
      <text x="12" y="74" class="body-text">• 지역명/방위 분리 추출 ("충남 서해" → region: "충남") &amp; 카테고리 매핑</text>
      <text x="12" y="88" class="body-text" font-weight="600" fill="#0F766E">→ PlanGoal DTO 생성 및 하위 전문 에이전트 자율 분기 지휘</text>
    </g>

    <!-- Connecting lines from Leader to Sub-agents -->
    <path d="M 110 148 L 110 180" fill="none" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arrow-teal)" />
    <path d="M 275 148 L 275 180" fill="none" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arrow-teal)" />

    <!-- Sub-Agent 1: SpotSearchAgent -->
    <g transform="translate(20, 188)">
      <rect width="165" height="135" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <text x="10" y="20" class="card-subtitle" fill="#0F766E">SpotSearchAgent</text>
      <text x="10" y="34" class="card-title">실존 스팟 탐색 (RAG)</text>
      <line x1="10" y1="40" x2="155" y2="40" stroke="#E2E8F0" stroke-width="0.8" />
      <text x="10" y="54" class="body-text">• DB 실존 5,000+ 스팟 쿼리</text>
      <text x="10" y="68" class="body-text" fill="#0F766E" font-weight="600">→ 가상 장소 환각(0%) 원천 차단</text>
      <text x="10" y="84" class="body-text">• 행정구역 듀얼 매핑</text>
      <text x="16" y="96" class="code-font" fill="#64748B">(충남 ↔ 충청남도)</text>
      <text x="10" y="112" class="body-text">• 한국 좌표 바운딩 박스</text>
      <text x="16" y="124" class="code-font" fill="#64748B">(33.0~38.9, 124.0~132.0)</text>
    </g>

    <!-- Sub-Agent 2: RouteOptimizerAgent -->
    <g transform="translate(20, 332)">
      <rect width="165" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <text x="10" y="20" class="card-subtitle" fill="#0F766E">RouteOptimizerAgent</text>
      <text x="10" y="34" class="card-title">동선 최적화 알고리즘</text>
      <line x1="10" y1="40" x2="155" y2="40" stroke="#E2E8F0" stroke-width="0.8" />
      <text x="10" y="56" class="body-text">• Haversine 구면 삼각 거리 연산</text>
      <text x="10" y="70" class="body-text">• Nearest Neighbor (탐욕법) 정렬</text>
    </g>

    <!-- Sub-Agent 3: WeatherAgent -->
    <g transform="translate(200, 188)">
      <rect width="165" height="100" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
      <text x="10" y="20" class="card-subtitle" fill="#0F766E">WeatherAgent</text>
      <text x="10" y="34" class="card-title">기상 및 일출몰 분석</text>
      <line x1="10" y1="40" x2="155" y2="40" stroke="#E2E8F0" stroke-width="0.8" />
      <text x="10" y="56" class="body-text">• 기상청 단기예보 공공 API 연계</text>
      <text x="10" y="70" class="body-text">• 한국천문연구원 일몰 시각 분석</text>
      <text x="10" y="84" class="body-text">• 골든아워(±20분) 자동 계산</text>
    </g>

    <!-- Flow Arrow to CourseCuratorAgent -->
    <path d="M 102 417 L 102 432 L 200 432" fill="none" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arrow-teal)" />
    <path d="M 282 288 L 282 422" fill="none" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arrow-teal)" />

    <!-- Sub-Agent 4: CourseCuratorAgent -->
    <g transform="translate(200, 300)">
      <rect width="165" height="140" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" filter="url(#card-shadow)" />
      <text x="10" y="20" class="card-subtitle" fill="#0F766E">CourseCuratorAgent</text>
      <text x="10" y="34" class="card-title">멀티데이 큐레이션 &amp; 가이드</text>
      <line x1="10" y1="40" x2="155" y2="40" stroke="#CCFBF1" stroke-width="0.8" />
      <text x="10" y="54" class="body-text">• N박 M일 일자별 균등 배분</text>
      <text x="16" y="66" class="code-font" fill="#0F766E">(dayNumber 1, 2, ...)</text>
      <text x="10" y="80" class="body-text">• 일차별 sequenceOrder 리셋</text>
      <text x="10" y="94" class="body-text">• 익일 첫 스팟 이동시간 0분 보정</text>
      <text x="10" y="108" class="body-text">• 스팟별 맞춤형 촬영 팁 생성</text>
      <text x="16" y="122" class="body-text" fill="#64748B">(구도, 시간대 가이드 DTO)</text>
    </g>

    <!-- Bottom Result Bar -->
    <rect x="20" y="490" width="345" height="38" rx="6" fill="#CCFBF1" stroke="#5EEAD4" stroke-width="1" />
    <text x="32" y="514" class="code-font" fill="#0F766E">CuratedCourseDraft (가드레일 통과 코스 완성)</text>
  </g>

  <!-- Arrow: Multi-Agent to Persistence & Notification -->
  <path d="M 855 357 L 885 357" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-teal)" />
  <text x="856" y="348" class="arrow-label" fill="#16A34A">Complete</text>

  <!-- 4. Persistence & Notification Section (Right Column) -->
  <g transform="translate(890, 85)">
    <!-- Container -->
    <rect width="170" height="545" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#container-shadow)" />
    <rect width="170" height="34" rx="12" fill="#F0FDF4" />
    <rect width="170" height="12" y="22" fill="#F0FDF4" />
    <text x="14" y="22" class="section-header" fill="#166534">4. 영속화 &amp; 알림</text>

    <!-- Service Card -->
    <g transform="translate(12, 50)">
      <rect width="146" height="80" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="8" y="22" class="card-subtitle" fill="#166534">AiCoursePlanService</text>
      <text x="8" y="42" class="body-text">• endDate 날짜 계산</text>
      <text x="8" y="56" class="body-text">• 빈 코스 방어 가드레일</text>
      <text x="8" y="70" class="body-text">• JPA 트랜잭션 영속화</text>
    </g>

    <path d="M 85 130 L 85 160" fill="none" stroke="#16A34A" stroke-width="1.6" marker-end="url(#arrow-teal)" />

    <!-- MySQL Card -->
    <g transform="translate(12, 168)">
      <rect width="146" height="105" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" filter="url(#card-shadow)" />
      <text x="8" y="22" class="card-title" fill="#166534">MySQL 데이터베이스</text>
      <line x1="8" y1="30" x2="138" y2="30" stroke="#DCFCE7" stroke-width="0.8" />
      <text x="8" y="46" class="code-font" fill="#15803D">Course</text>
      <text x="14" y="60" class="body-text">• startDate, endDate</text>
      <text x="8" y="76" class="code-font" fill="#15803D">CourseSpot</text>
      <text x="14" y="90" class="body-text">• dayNumber, sequence</text>
      <text x="14" y="102" class="body-text">• memo (AI 촬영팁)</text>
    </g>

    <path d="M 85 273 L 85 303" fill="none" stroke="#16A34A" stroke-width="1.6" marker-end="url(#arrow-teal)" />

    <!-- FCM Push Card -->
    <g transform="translate(12, 311)">
      <rect width="146" height="95" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" filter="url(#card-shadow)" />
      <text x="8" y="22" class="card-title" fill="#B45309">FCM 푸시 알림 발송</text>
      <line x1="8" y1="30" x2="138" y2="30" stroke="#FDE68A" stroke-width="0.8" />
      <text x="8" y="46" class="body-text">NotificationService</text>
      <text x="8" y="60" class="body-text">백그라운드 디바이스 전송</text>
      <rect x="6" y="68" width="134" height="20" rx="3" fill="#FFFFFF" stroke="#FDE68A" />
      <text x="10" y="82" class="code-font" fill="#B45309">"코스가 완성되었어요!"</text>
    </g>

    <!-- Deep Link Arrow back to Client -->
    <path d="M 85 406 L 85 450 C 85 645, 100 645, 100 528" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-teal)" />
    <text x="480" y="640" class="arrow-label" fill="#16A34A">모바일 딥링크 수신: 푸시 배너 탭 시 코스 상세 화면(/courses/:id) 원터치 라우팅</text>
  </g>
</svg>
