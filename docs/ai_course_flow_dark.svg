<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1120" width="100%" height="100%">
  <defs>
    <style>
      .header-title { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #E2E8F0; }
      .box-title { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 600; fill: #FFFFFF; }
      .box-desc { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 400; fill: #94A3B8; }
      .subgraph-title { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #94A3B8; }
      .label-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 500; fill: #CBD5E1; }
    </style>

    <!-- Drop Shadow for Nodes -->
    <filter id="node-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Blue Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8" />
    </marker>
  </defs>

  <!-- Background (Dark Charcoal matching Mermaid viewer) -->
  <rect width="780" height="1120" fill="#141517" rx="12" />

  <!-- Top Title -->
  <text x="36" y="38" class="header-title">1. 전체 아키텍처 및 동작 흐름 (한눈에 보는 그림)</text>

  <!-- ==================== TOP: CONTROLLER & USER REQUEST ==================== -->

  <!-- CourseAiController Box -->
  <g transform="translate(100, 65)">
    <rect width="250" height="60" rx="4" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
    <text x="125" y="26" text-anchor="middle" class="box-title">CourseAiController</text>
    <text x="125" y="44" text-anchor="middle" class="box-desc">POST /api/v1/courses/ai-plan</text>
  </g>

  <!-- User Request Pill -->
  <g transform="translate(70, 245)">
    <rect width="230" height="54" rx="27" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
    <text x="115" y="24" text-anchor="middle" class="box-title">사용자 요청</text>
    <text x="115" y="41" text-anchor="middle" class="box-desc">"부산 노을/야경 코스 짜줘"</text>
  </g>

  <!-- Arrow: User -> Controller (Upward) -->
  <path d="M 215,245 L 215,133" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Arrow: Controller -> User (Downward with 202 label) -->
  <path d="M 145,125 L 145,237" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Label 1: 202 Response -->
  <g transform="translate(80, 160)">
    <rect width="130" height="42" rx="4" fill="#1A1C20" stroke="#374151" stroke-width="1" />
    <text x="65" y="18" text-anchor="middle" class="label-text">1. 즉시 202 응답 반환</text>
    <text x="65" y="32" text-anchor="middle" class="box-desc">taskId 발급</text>
  </g>

  <!-- Arrow: Controller -> Producer (Right then Down) -->
  <path d="M 350,95 L 485,95 L 485,172" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Label 2: Background Dispatch -->
  <g transform="translate(415, 120)">
    <rect width="140" height="30" rx="4" fill="#1A1C20" stroke="#374151" stroke-width="1" />
    <text x="70" y="19" text-anchor="middle" class="label-text">2. 백그라운드 작업 발행</text>
  </g>

  <!-- ==================== ASYNC BROKER ==================== -->

  <!-- AiCoursePlanProducer Box -->
  <g transform="translate(370, 180)">
    <rect width="230" height="48" rx="4" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
    <text x="115" y="29" text-anchor="middle" class="box-title">AiCoursePlanProducer</text>
  </g>

  <!-- Arrow: Producer -> RabbitMQ -->
  <path d="M 485,228 L 485,255" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- RabbitMQ Cylinder -->
  <g transform="translate(380, 260)">
    <path d="M 0,14 A 105,14 0 0,0 210,14 L 210,50 A 105,14 0 0,1 0,50 Z" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
    <ellipse cx="105" cy="14" rx="105" ry="14" fill="#282A30" stroke="#4B5563" stroke-width="1.2" />
    <text x="105" y="35" text-anchor="middle" class="box-title">RabbitMQ 큐</text>
    <text x="105" y="49" text-anchor="middle" class="box-desc">course.ai.plan.queue</text>
  </g>

  <!-- Arrow: RabbitMQ -> Consumer -->
  <path d="M 485,324 L 485,355" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- AiCoursePlanConsumer Box -->
  <g transform="translate(370, 362)">
    <rect width="230" height="48" rx="4" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
    <text x="115" y="29" text-anchor="middle" class="box-title">AiCoursePlanConsumer</text>
  </g>

  <!-- Arrow: Consumer -> LeaderAgent -->
  <path d="M 485,410 L 485,472" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- ==================== SUBGRAPH: MULTI-AGENT ORCHESTRATION ==================== -->

  <g transform="translate(45, 455)">
    <!-- Subgraph Container Frame -->
    <rect width="690" height="345" rx="6" fill="#18191C" stroke="#3F424A" stroke-width="1.2" />
    <text x="18" y="22" class="subgraph-title">멀티 에이전트 오케스트레이션</text>

    <!-- LeaderAgent (지휘자) -->
    <g transform="translate(245, 25)">
      <rect width="300" height="54" rx="4" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
      <text x="150" y="23" text-anchor="middle" class="box-title">LeaderAgent (지휘자)</text>
      <text x="150" y="41" text-anchor="middle" class="box-desc">자연어 의도 분석 &amp; 작업 분배</text>
    </g>

    <!-- Connecting Arrow: Leader -> SpotSearchAgent -->
    <path d="M 450,79 L 450,110 L 585,110 L 585,123" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

    <!-- SpotSearchAgent (스팟 탐색) -->
    <g transform="translate(440, 130)">
      <rect width="235" height="54" rx="4" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
      <text x="117" y="23" text-anchor="middle" class="box-title">SpotSearchAgent (스팟 탐색)</text>
      <text x="117" y="41" text-anchor="middle" class="box-desc">우리 DB의 실존 스팟 후보 추출 (환각 차단)</text>
    </g>

    <!-- Connecting Arrow: Leader -> WeatherAgent -->
    <path d="M 350,79 L 350,110 L 160,110 L 160,203" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

    <!-- Connecting Arrow: SpotSearchAgent -> RouteOptimizerAgent -->
    <path d="M 557,184 L 557,203" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

    <!-- WeatherAgent (날씨/골든아워) -->
    <g transform="translate(15, 210)">
      <rect width="290" height="54" rx="4" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
      <text x="145" y="23" text-anchor="middle" class="box-title">WeatherAgent (날씨/골든아워)</text>
      <text x="145" y="41" text-anchor="middle" class="box-desc">기상청 예보 &amp; 일출몰 골든아워 데이터 조회</text>
    </g>

    <!-- RouteOptimizerAgent (동선 최적화) -->
    <g transform="translate(325, 210)">
      <rect width="350" height="54" rx="4" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
      <text x="175" y="23" text-anchor="middle" class="box-title">RouteOptimizerAgent (동선 최적화)</text>
      <text x="175" y="41" text-anchor="middle" class="box-desc">좌표 기반 최단 동선 &amp; 이동시간 계산 (수학 공식)</text>
    </g>

    <!-- Connecting Arrows to CourseCuratorAgent -->
    <path d="M 160,264 L 160,278 L 395,278 L 395,286" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M 500,264 L 500,278 L 470,278 L 470,286" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

    <!-- CourseCuratorAgent (큐레이터) -->
    <g transform="translate(180, 292)">
      <rect width="320" height="46" rx="4" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
      <text x="160" y="19" text-anchor="middle" class="box-title">CourseCuratorAgent (큐레이터)</text>
      <text x="160" y="34" text-anchor="middle" class="box-desc">골든아워 맞춤 촬영 팁 &amp; 감성 가이드 작성</text>
    </g>
  </g>

  <!-- ==================== PERSISTENCE & NOTIFICATION ==================== -->

  <!-- Arrow: Curator -> MySQL -->
  <path d="M 485,798 L 485,825" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- MySQL DB Cylinder -->
  <g transform="translate(380, 830)">
    <path d="M 0,14 A 105,14 0 0,0 210,14 L 210,50 A 105,14 0 0,1 0,50 Z" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
    <ellipse cx="105" cy="14" rx="105" ry="14" fill="#282A30" stroke="#4B5563" stroke-width="1.2" />
    <text x="105" y="35" text-anchor="middle" class="box-title">MySQL DB 영속화</text>
    <text x="105" y="49" text-anchor="middle" class="box-desc">Course &amp; CourseSpot 저장</text>
  </g>

  <!-- Arrow: MySQL -> Notification -->
  <path d="M 485,894 L 485,925" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- NotificationService & FCM Box -->
  <g transform="translate(370, 932)">
    <rect width="230" height="48" rx="4" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
    <text x="115" y="29" text-anchor="middle" class="box-title">NotificationService &amp; FCM</text>
  </g>

  <!-- Arrow: Notification -> Push Finished -->
  <path d="M 485,980 L 485,1012" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Final Push Pill -->
  <g transform="translate(355, 1018)">
    <rect width="260" height="54" rx="27" fill="#202226" stroke="#4B5563" stroke-width="1.2" filter="url(#node-shadow)" />
    <text x="130" y="24" text-anchor="middle" class="box-title">푸시 알림 도착!</text>
    <text x="130" y="41" text-anchor="middle" class="box-desc">"AI 코스가 완성되었습니다"</text>
  </g>
</svg>
