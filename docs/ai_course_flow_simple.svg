<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .sub-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 400; fill: #475569; }
      .sub-text-muted { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; font-weight: 400; fill: #64748B; }
      .badge-title { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #0F766E; }
      .group-title { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #0F766E; }
      .arrow-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10.5px; font-weight: 600; fill: #2563EB; }
      .arrow-text-dark { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; }
      .code-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 600; }
    </style>

    <!-- Drop Shadows -->
    <filter id="shadow-sm" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0D9488" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="920" fill="#FFFFFF" rx="12" />

  <!-- ==================== 1. INGRESS & CONTROLLER ==================== -->

  <!-- User Prompt Pill -->
  <g transform="translate(60, 45)">
    <rect width="210" height="64" rx="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)" />
    <text x="105" y="28" text-anchor="middle" class="title-text">사용자 요청</text>
    <text x="105" y="46" text-anchor="middle" class="sub-text" fill="#2563EB">"부산 노을/야경 코스 짜줘"</text>
  </g>

  <!-- Controller Box -->
  <g transform="translate(380, 40)">
    <rect width="320" height="74" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#shadow-sm)" />
    <text x="160" y="28" text-anchor="middle" class="title-text" fill="#1E40AF">CourseAiController</text>
    <text x="160" y="46" text-anchor="middle" class="code-text" fill="#2563EB">POST /api/v1/courses/ai-plan</text>
    <text x="160" y="62" text-anchor="middle" class="sub-text-muted">즉시 202 반환 &amp; 백그라운드 큐 발행</text>
  </g>

  <!-- Flow 1: User -> Controller (Request) -->
  <path d="M 270 65 L 380 65" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)" />

  <!-- Flow 2: Controller -> User (202 Accepted) -->
  <path d="M 380 90 L 270 90" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-blue)" />
  <rect x="282" y="98" width="86" height="28" rx="4" fill="#DBEAFE" />
  <text x="325" y="110" text-anchor="middle" class="arrow-text" fill="#1D4ED8">1. 202 Accepted</text>
  <text x="325" y="121" text-anchor="middle" class="sub-text-muted" fill="#1E40AF">taskId 즉시 발급</text>

  <!-- Flow 3: Controller -> Producer -->
  <path d="M 540 114 L 540 162" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-slate)" />
  <text x="548" y="142" class="arrow-text-dark">2. 백그라운드 작업 발행</text>

  <!-- ==================== 2. ASYNC QUEUE ==================== -->

  <!-- Producer -->
  <g transform="translate(420, 162)">
    <rect width="240" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow-sm)" />
    <text x="120" y="26" text-anchor="middle" class="title-text" font-size="13px">AiCoursePlanProducer</text>
  </g>

  <path d="M 540 204 L 540 230" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-slate)" />

  <!-- RabbitMQ Queue -->
  <g transform="translate(420, 230)">
    <rect width="240" height="48" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.4" filter="url(#shadow-sm)" />
    <text x="120" y="22" text-anchor="middle" class="title-text" font-size="13px" fill="#6B21A8">RabbitMQ 큐</text>
    <text x="120" y="38" text-anchor="middle" class="code-text" fill="#7C3AED">course.ai.plan.queue</text>
  </g>

  <path d="M 540 278 L 540 304" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-slate)" />

  <!-- Consumer -->
  <g transform="translate(420, 304)">
    <rect width="240" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow-sm)" />
    <text x="120" y="26" text-anchor="middle" class="title-text" font-size="13px">AiCoursePlanConsumer</text>
  </g>

  <!-- Flow 4: Consumer -> Multi-Agent Box -->
  <path d="M 540 346 L 540 380" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)" />

  <!-- ==================== 3. MULTI-AGENT ORCHESTRATION ==================== -->

  <!-- Outer Orchestration Box -->
  <g transform="translate(50, 380)">
    <rect width="660" height="295" rx="12" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.5" />
    <rect x="14" y="10" width="170" height="22" rx="4" fill="#CCFBF1" />
    <text x="99" y="25" text-anchor="middle" class="group-title">멀티 에이전트 오케스트레이션</text>

    <!-- Leader Agent -->
    <g transform="translate(190, 40)">
      <rect width="280" height="52" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.4" filter="url(#shadow-sm)" />
      <text x="140" y="22" text-anchor="middle" class="title-text" fill="#0F766E">LeaderAgent (지휘자)</text>
      <text x="140" y="40" text-anchor="middle" class="sub-text">자연어 의도 분석 &amp; 일정·작업 분배</text>
    </g>

    <!-- Connecting Arrows: Leader -> 3 Agents -->
    <path d="M 260 92 L 115 125 L 115 130" fill="none" stroke="#0D9488" stroke-width="1.4" marker-end="url(#arrow-teal)" />
    <path d="M 330 92 L 330 130" fill="none" stroke="#0D9488" stroke-width="1.4" marker-end="url(#arrow-teal)" />
    <path d="M 400 92 L 545 125 L 545 130" fill="none" stroke="#0D9488" stroke-width="1.4" marker-end="url(#arrow-teal)" />

    <!-- Agent 1: SpotSearchAgent -->
    <g transform="translate(20, 130)">
      <rect width="190" height="58" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow-sm)" />
      <text x="95" y="23" text-anchor="middle" class="title-text" font-size="12px">SpotSearchAgent</text>
      <text x="95" y="41" text-anchor="middle" class="sub-text-muted">우리 DB 실존 스팟 추출</text>
      <text x="95" y="52" text-anchor="middle" class="sub-text-muted" font-weight="600" fill="#0F766E">(가상 장소 환각 차단)</text>
    </g>

    <!-- Agent 2: RouteOptimizerAgent -->
    <g transform="translate(235, 130)">
      <rect width="190" height="58" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow-sm)" />
      <text x="95" y="23" text-anchor="middle" class="title-text" font-size="12px">RouteOptimizerAgent</text>
      <text x="95" y="41" text-anchor="middle" class="sub-text-muted">좌표 기반 최단 동선 계산</text>
      <text x="95" y="52" text-anchor="middle" class="sub-text-muted">(Haversine / Nearest Neighbor)</text>
    </g>

    <!-- Agent 3: WeatherAgent -->
    <g transform="translate(450, 130)">
      <rect width="190" height="58" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow-sm)" />
      <text x="95" y="23" text-anchor="middle" class="title-text" font-size="12px">WeatherAgent</text>
      <text x="95" y="41" text-anchor="middle" class="sub-text-muted">기상청 단기예보 조회</text>
      <text x="95" y="52" text-anchor="middle" class="sub-text-muted">&amp; 일출몰 골든아워 분석</text>
    </g>

    <!-- Connecting Arrows: 3 Agents -> Curator -->
    <path d="M 115 188 L 115 208 L 260 220" fill="none" stroke="#0D9488" stroke-width="1.4" marker-end="url(#arrow-teal)" />
    <path d="M 330 188 L 330 220" fill="none" stroke="#0D9488" stroke-width="1.4" marker-end="url(#arrow-teal)" />
    <path d="M 545 188 L 545 208 L 400 220" fill="none" stroke="#0D9488" stroke-width="1.4" marker-end="url(#arrow-teal)" />

    <!-- Agent 4: CourseCuratorAgent -->
    <g transform="translate(190, 220)">
      <rect width="280" height="54" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.4" filter="url(#shadow-sm)" />
      <text x="140" y="22" text-anchor="middle" class="title-text" fill="#0F766E">CourseCuratorAgent (큐레이터)</text>
      <text x="140" y="40" text-anchor="middle" class="sub-text">골든아워 맞춤 촬영 팁 &amp; N박 M일 가이드 조립</text>
    </g>
  </g>

  <!-- Flow 5: Curator -> Persistence -->
  <path d="M 380 675 L 380 705" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-slate)" />

  <!-- ==================== 4. PERSISTENCE & PUSH ==================== -->

  <!-- MySQL DB -->
  <g transform="translate(230, 705)">
    <rect width="300" height="48" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)" />
    <text x="150" y="22" text-anchor="middle" class="title-text" font-size="13px">MySQL DB 영속화</text>
    <text x="150" y="38" text-anchor="middle" class="sub-text-muted">Course (기간/제목) &amp; CourseSpot (일자/순서/팁) 저장</text>
  </g>

  <path d="M 380 753 L 380 778" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-slate)" />

  <!-- Notification & FCM -->
  <g transform="translate(230, 778)">
    <rect width="300" height="46" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow-sm)" />
    <text x="150" y="22" text-anchor="middle" class="title-text" font-size="13px">NotificationService &amp; FCM</text>
    <text x="150" y="38" text-anchor="middle" class="sub-text-muted">백그라운드 모바일 디바이스 푸시 발송</text>
  </g>

  <path d="M 380 824 L 380 848" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-slate)" />

  <!-- Final Push Arrival Pill -->
  <g transform="translate(240, 848)">
    <rect width="280" height="48" rx="24" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.4" filter="url(#shadow-sm)" />
    <text x="140" y="22" text-anchor="middle" class="title-text" font-size="13px" fill="#15803D">푸시 알림 도착 &amp; 딥링크 진입</text>
    <text x="140" y="38" text-anchor="middle" class="sub-text" fill="#166534">"AI 코스가 완성되었습니다" → /courses/:id 직행</text>
  </g>
</svg>
