<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="100%" height="100%">
  <defs>
    <style>
      .header-title { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .box-title { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .box-desc { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 500; fill: #475569; }
      .box-desc-muted { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; }
      .subgraph-title { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
      .label-text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10.5px; font-weight: 600; fill: #1E293B; }
      .label-sub { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 9.5px; font-weight: 500; fill: #64748B; }
    </style>

    <!-- Subtle Drop Shadow for Cards -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>

    <!-- Vivid Blue Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Transparent Background (Embeds seamlessly on white/off-white slides) -->
  <rect width="1280" height="430" fill="none" />

  <!-- Top Title -->
  <text x="35" y="36" class="header-title">1. 전체 아키텍처 및 동작 흐름 (한눈에 보는 그림)</text>

  <!-- ==================== STAGE 1: INGRESS & CONTROLLER ==================== -->

  <!-- CourseAiController Box -->
  <g transform="translate(35, 75)">
    <rect width="195" height="65" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
    <text x="97" y="27" text-anchor="middle" class="box-title">CourseAiController</text>
    <text x="97" y="46" text-anchor="middle" class="box-desc-muted">POST /api/v1/courses/ai-plan</text>
  </g>

  <!-- User Request Pill -->
  <g transform="translate(35, 245)">
    <rect width="195" height="54" rx="27" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
    <text x="97" y="24" text-anchor="middle" class="box-title">사용자 요청</text>
    <text x="97" y="41" text-anchor="middle" class="box-desc" fill="#2563EB">"부산 노을/야경 코스 짜줘"</text>
  </g>

  <!-- Arrow: User -> Controller (Upward) -->
  <path d="M 165,245 L 165,146" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Arrow: Controller -> User (Downward with 202 badge) -->
  <path d="M 75,140 L 75,239" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Label 1: 202 Response Badge -->
  <g transform="translate(42, 168)">
    <rect width="115" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
    <text x="57" y="17" text-anchor="middle" class="label-text">1. 즉시 202 응답</text>
    <text x="57" y="31" text-anchor="middle" class="label-sub">taskId 발급</text>
  </g>

  <!-- Arrow: Controller -> Producer (Right) -->
  <path d="M 230,107 L 269,107" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Label 2: Background Task Dispatch -->
  <g transform="translate(195, 52)">
    <rect width="130" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)" />
    <text x="65" y="17" text-anchor="middle" class="label-text">2. 백그라운드 작업 발행</text>
  </g>

  <!-- ==================== STAGE 2: ASYNC QUEUE ==================== -->

  <!-- Producer Box -->
  <g transform="translate(275, 85)">
    <rect width="165" height="45" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
    <text x="82" y="28" text-anchor="middle" class="box-title">AiCoursePlanProducer</text>
  </g>

  <path d="M 357,130 L 357,157" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- RabbitMQ Cylinder -->
  <g transform="translate(275, 163)">
    <path d="M 0,12 A 82.5,12 0 0,0 165,12 L 165,46 A 82.5,12 0 0,1 0,46 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
    <ellipse cx="82.5" cy="12" rx="82.5" ry="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" />
    <text x="82.5" y="30" text-anchor="middle" class="box-title">RabbitMQ 큐</text>
    <text x="82.5" y="44" text-anchor="middle" class="box-desc-muted">course.ai.plan.queue</text>
  </g>

  <path d="M 357,210 L 357,237" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Consumer Box -->
  <g transform="translate(275, 243)">
    <rect width="165" height="45" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
    <text x="82" y="28" text-anchor="middle" class="box-title">AiCoursePlanConsumer</text>
  </g>

  <!-- Arrow: Consumer -> Multi-Agent Container -->
  <path d="M 440,265 L 460,265 L 460,210 L 479,210" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- ==================== STAGE 3: MULTI-AGENT ORCHESTRATION (HORIZONTAL PIPELINE) ==================== -->

  <g transform="translate(485, 75)">
    <!-- Subgraph Container Frame -->
    <rect width="510" height="280" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4" />
    <text x="18" y="24" class="subgraph-title">멀티 에이전트 오케스트레이션</text>

    <!-- Sub-Stage A: LeaderAgent (Left) -->
    <g transform="translate(15, 100)">
      <rect width="135" height="70" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
      <text x="67" y="25" text-anchor="middle" class="box-title">LeaderAgent</text>
      <text x="67" y="42" text-anchor="middle" class="box-desc">(지휘자)</text>
      <text x="67" y="58" text-anchor="middle" class="box-desc-muted">의도 분석 &amp; 분배</text>
    </g>

    <!-- Branch Arrows from Leader to 3 Agents -->
    <path d="M 150,120 L 165,120 L 165,65 L 179,65" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M 150,135 L 179,135" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M 150,150 L 165,150 L 165,205 L 179,205" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

    <!-- Sub-Stage B: 3 Specialist Agents (Middle Column) -->
    <!-- 1. SpotSearchAgent -->
    <g transform="translate(185, 40)">
      <rect width="165" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
      <text x="82" y="21" text-anchor="middle" class="box-title">SpotSearchAgent</text>
      <text x="82" y="38" text-anchor="middle" class="box-desc-muted">실존 스팟 추출 (환각 차단)</text>
    </g>

    <!-- 2. RouteOptimizerAgent -->
    <g transform="translate(185, 110)">
      <rect width="165" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
      <text x="82" y="21" text-anchor="middle" class="box-title">RouteOptimizerAgent</text>
      <text x="82" y="38" text-anchor="middle" class="box-desc-muted">최단 동선 &amp; 이동시간 계산</text>
    </g>

    <!-- 3. WeatherAgent -->
    <g transform="translate(185, 180)">
      <rect width="165" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
      <text x="82" y="21" text-anchor="middle" class="box-title">WeatherAgent</text>
      <text x="82" y="38" text-anchor="middle" class="box-desc-muted">기상청 예보 &amp; 골든아워 조회</text>
    </g>

    <!-- Converging Arrows to CuratorAgent -->
    <path d="M 350,65 L 365,65 L 365,120 L 379,120" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M 350,135 L 379,135" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M 350,205 L 365,205 L 365,150 L 379,150" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

    <!-- Sub-Stage C: CourseCuratorAgent (Right) -->
    <g transform="translate(385, 100)">
      <rect width="115" height="70" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
      <text x="57" y="24" text-anchor="middle" class="box-title">CuratorAgent</text>
      <text x="57" y="41" text-anchor="middle" class="box-desc">(큐레이터)</text>
      <text x="57" y="57" text-anchor="middle" class="box-desc-muted">촬영 팁 &amp; 조립</text>
    </g>
  </g>

  <!-- Arrow: Curator -> Stage 4 (MySQL) -->
  <path d="M 985,210 L 1010,210 L 1010,115 L 1029,115" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- ==================== STAGE 4: PERSISTENCE & NOTIFICATION ==================== -->

  <!-- MySQL Cylinder -->
  <g transform="translate(1035, 80)">
    <path d="M 0,12 A 95,12 0 0,0 190,12 L 190,52 A 95,12 0 0,1 0,52 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
    <ellipse cx="95" cy="12" rx="95" ry="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" />
    <text x="95" y="32" text-anchor="middle" class="box-title">MySQL DB 영속화</text>
    <text x="95" y="48" text-anchor="middle" class="box-desc-muted">Course &amp; CourseSpot 저장</text>
  </g>

  <path d="M 1130,138 L 1130,172" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- NotificationService & FCM Box -->
  <g transform="translate(1035, 178)">
    <rect width="190" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
    <text x="95" y="28" text-anchor="middle" class="box-title">NotificationService &amp; FCM</text>
  </g>

  <path d="M 1130,224 L 1130,258" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Final Push Pill -->
  <g transform="translate(1025, 264)">
    <rect width="210" height="52" rx="26" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#card-shadow)" />
    <text x="105" y="23" text-anchor="middle" class="box-title">푸시 알림 도착!</text>
    <text x="105" y="40" text-anchor="middle" class="box-desc" fill="#2563EB">"AI 코스가 완성되었습니다"</text>
  </g>
</svg>
