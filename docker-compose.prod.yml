# 운영 배포용 전체 스택. 로컬 개발용 docker-compose.yml(Redis·RabbitMQ만)과는 별개다.
#
# 사용법:
#   1) .env.prod 파일을 이 파일과 같은 위치에 준비 (DB_URL 등 전체 값)
#   2) secrets/firebase-key.json 배치 (git에 안 올라가는 서비스 계정 키)
#   3) docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# DB/Redis/RabbitMQ/Prometheus/Grafana 포트는 호스트에 노출하지 않는다.
# app 컨테이너만 8080을 열어 외부에서 접근 가능하고, 나머지는 내부 네트워크로만 통신한다.
#
# 모든 서비스에 x-logging을 공유한다. 컨테이너 6개 전부 무제한 로그 드라이버를 쓰면
# 디스크가 로그만으로 꽉 찰 수 있다 - 실제로 부하테스트 중 예외 스택트레이스 버그 하나로
# 60초에 117MB가 쌓인 적이 있다(이번엔 고쳤지만, 앱 코드가 다시 그런 실수를 하지 않는다는
# 보장은 없다). 서비스당 최대 150MB(50MB x 3파일)로 상한을 건다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # 이름을 고정해둔다. 태그 없이 build만 있으면 compose가 프로젝트 폴더명 기준으로
    # 자동 생성한 이름을 쓰는데, 로컬에서 build한 이미지를 docker save/load로 옮길 때
    # 이름이 어긋나기 쉽다. image를 명시하면 로컬 빌드든 CI/CD든 항상 같은 이름을 쓴다.
    image: picngo-app:prod
    container_name: picngo-app
    restart: always
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/picngo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      WEATHER_SERVICE_KEY: ${WEATHER_SERVICE_KEY}
      PUBLIC_DATA_SERVICE_KEY: ${PUBLIC_DATA_SERVICE_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES}
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS}
      # firebase-key.json을 이미지에 굽지 않고 아래 volumes로 마운트한 파일을 가리킨다.
      FIREBASE_CONFIG_PATH: file:/app/secrets/firebase-key.json
    volumes:
      - ./secrets/firebase-key.json:/app/secrets/firebase-key.json:ro
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - picngo-net

  mysql:
    image: mysql:8
    container_name: picngo-mysql
    restart: always
    logging: *default-logging
    environment:
      MYSQL_DATABASE: picngo
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # SSH 터널링 접속을 위해 EC2 내부 localhost:3306 포트를 개방한다.
    ports:
      - "3306:3306"
    networks:

      - picngo-net

  redis:
    image: redis:7-alpine
    container_name: picngo-redis
    restart: always
    logging: *default-logging
    volumes:
      - redis-data:/data
    networks:
      - picngo-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: picngo-rabbitmq
    restart: always
    logging: *default-logging
    # RabbitMQ 기본 guest 계정은 localhost(loopback)에서만 로그인이 허용된다.
    # app 컨테이너는 브로커 입장에서 다른 호스트라 guest로는 연결 자체가 거부된다
    # (ACCESS_REFUSED). RABBITMQ_USERNAME을 guest가 아닌 값으로 채워야 한다.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - picngo-net

  # MySQL 내부 상태를 프로메테우스로 노출한다. 앱 지표(http_server_requests)만으로는
  # "느리다"까지만 알 수 있고 "왜 느린가"를 못 본다. 검색 쿼리가 LIKE '%키워드%'라
  # 인덱스를 못 타는데, 그 증거(스캔한 행 수 / 버퍼풀 히트율 / 임시테이블)는 DB 쪽에만 있다.
  #
  # 인증: 지금은 root로 붙는다. mysql-data 볼륨이 이미 초기화된 상태라
  # /docker-entrypoint-initdb.d 스크립트가 실행되지 않아서, 전용 계정을 쓰려면
  # 아래를 수동으로 실행한 뒤 --mysqld.username과 비밀번호를 바꿔주면 된다:
  #   CREATE USER 'exporter'@'%' IDENTIFIED BY '...' WITH MAX_USER_CONNECTIONS 3;
  #   GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'exporter'@'%';
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: picngo-mysqld-exporter
    restart: always
    logging: *default-logging
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=root"
      # 기본 수집기(global_status/global_variables)에서 나오는 핵심 지표:
      #   handler_read_rnd_next      - 풀스캔으로 읽은 행 수. 검색 1회당 증가량이 곧 스캔 비용
      #   innodb_buffer_pool_reads   - 버퍼풀 미스. 풀스캔이 캐시를 밀어내는 순간이 보인다
      #   created_tmp_disk_tables    - filesort/임시테이블이 디스크로 내려간 횟수
      #   threads_running            - 동시 실행 스레드. 코어 수를 넘으면 지연이 급격히 꺾인다
      - "--collect.info_schema.innodb_metrics"
      # 쿼리 다이제스트별 통계. rows_examined / rows_sent 비율(= 선택도)과
      # no_index_used 카운터가 여기서 나온다. "1건 반환하려고 N행을 읽는다"를
      # 한 숫자로 보여주는 지표라 이번 계측의 핵심이다.
      - "--collect.perf_schema.eventsstatements"
      # 다이제스트는 종류만큼 시계열이 생긴다. 상위 50개로 잘라 카디널리티를 묶어둔다.
      - "--collect.perf_schema.eventsstatements.limit=50"
      - "--collect.perf_schema.eventsstatements.digest_text_limit=120"
      - "--collect.perf_schema.tablelocks"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - picngo-net

  prometheus:
    image: prom/prometheus:latest
    container_name: picngo-prometheus
    restart: always
    logging: *default-logging
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - picngo-net

  grafana:
    image: grafana/grafana:latest
    container_name: picngo-grafana
    restart: always
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      # Grafana는 관리 도구라 임시로 열어둔다. 운영 확정되면 SSH 터널이나
      # VPN으로만 접근하도록 이 포트 노출도 제거하는 게 안전하다.
      # 호스트 포트를 8081로 잡은 이유: Windows가 Hyper-V/WSL2용으로 3000번을 포함한
      # 대역을 동적 포트로 예약해두는 경우가 있어(netsh interface ipv4 show
      # excludedportrange) 로컬에서 3000:3000이 바인딩 실패할 수 있다. 컨테이너
      # 내부 포트는 그대로 3000이라 실제 배포 서버(Linux)에는 영향 없다.
      - "8081:3000"
    depends_on:
      - prometheus
    networks:
      - picngo-net

networks:
  picngo-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
