# 앱 장애 알림 규칙. 1분마다 평가한다.
# job 이름이 운영(picngo-app)과 로컬(picngo-app-local)이 달라 둘 다 맞도록 정규식으로 쓴다.
apiVersion: 1

groups:
  - orgId: 1
    name: picngo-app
    folder: PicNGo Alerts
    interval: 1m
    rules:
      # 서버 다운: Prometheus가 앱 지표를 1분 동안 못 가져오면 울린다.
      # 지표 자체가 사라진 경우(NoData)와 Prometheus 조회가 실패한 경우(Error)도 장애로 본다.
      - uid: picngo-app-down
        title: 서버 다운
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: picngo-prometheus
            model:
              refId: A
              expr: 'max(up{job=~"picngo-app(-local)?"})'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'PicNGo 앱 서버가 응답하지 않습니다'
          description: 'Prometheus가 1분 넘게 /actuator/prometheus 지표를 가져오지 못했습니다. 컨테이너 상태와 앱 로그를 확인하세요.'

      # 500 에러 급증: 최근 5분간 서버 내부 오류(5xx)가 약 5건 이상이면 울린다.
      # 기준값(4 초과)은 실사용 트래픽을 보기 전에 정한 출발점이라, 운영하며 조정한다.
      # 서버가 죽어서 지표가 끊긴 경우는 위의 "서버 다운"이 맡으므로 여기서는 NoData·Error를 정상으로 둔다.
      - uid: picngo-app-5xx-spike
        title: 500 에러 급증
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: picngo-prometheus
            model:
              refId: A
              expr: 'sum(increase(http_server_requests_seconds_count{job=~"picngo-app(-local)?", outcome="SERVER_ERROR"}[5m]))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [4]
        noDataState: OK
        execErrState: OK
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: '최근 5분간 500 에러가 급증했습니다'
          description: '서버 내부 오류(5xx)가 5분 동안 약 {{ printf "%.0f" $values.A.Value }}건 발생했습니다. 앱 로그에서 스택 트레이스를 확인하세요.'
