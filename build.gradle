plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Flyway (DB 마이그레이션). 앱이 뜰 때 db/migration의 SQL을 순서대로 적용하고
	// 적용 이력을 flyway_schema_history 테이블에 남긴다.
	//
	// flyway-mysql을 따로 넣는 이유: Flyway 10부터 DB별 지원이 코어에서 분리됐다.
	// 이게 없으면 기동 시 "MySQL을 지원하지 않는다"며 실패한다.
	//
	// spring-boot-flyway: Boot 4.0부터 Flyway 자동설정이 spring-boot-autoconfigure에서
	// 별도 모듈로 분리됐다. 이게 없으면 flyway-core가 클래스패스에 있어도 마이그레이션이
	// 아예 실행되지 않는다(로그도 안 남고 ddl-auto: validate만 실패한다).
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-mysql'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// RabbitMQ (비동기 메시지 큐)
	implementation 'org.springframework.boot:spring-boot-starter-amqp'

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// OAuth2 Client
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spring MVC + Rest API
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Actuator (헬스체크·메트릭). health만 노출 (application-prod.yaml에서 제한)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'


	// WebFlux (for WebClient - 비동기 외부 API 호출용)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Resilience4j (서킷브레이커). Spring Boot 4용 스타터 모듈이 아직 없어 코어 모듈만 쓰고
	// @CircuitBreaker 어노테이션 대신 CircuitBreaker.decorateSupplier로 직접 감싼다.
	implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.3.0'

	// Swagger UI (API 문서화)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	//SMTP
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Lombok
	compileOnly 'org.projectlombok:lombok'

	// Spring Boot DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// MySQL JDBC Driver
	runtimeOnly 'com.mysql:mysql-connector-j'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Lombok Annotation 처리기
	annotationProcessor 'org.projectlombok:lombok'

	// YAML 파일 파싱 라이브러리
	implementation 'org.yaml:snakeyaml:2.5'


	// Firebase Admin SDK (푸시 알림)
	implementation 'com.google.firebase:firebase-admin:9.2.0'

	// WebSocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// EXIF 추출 라이브러리
	implementation 'com.drewnoakes:metadata-extractor:2.19.0'

	// AWS S3
	implementation platform('software.amazon.awssdk:bom:2.25.70')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:auth'

	// 테스트용 라이브러리
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.11.0'
	testImplementation 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

jar {
	enabled = false
}
