spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: picngo
  sql:
    init:
      mode: always
      data-locations:
        - classpath:data.sql
        - classpath:spot_data.sql

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      # create로 두면 기동마다 전체 테이블을 DROP+재생성해 users/review 등 데이터가 소실된다.
      # 스키마를 갈아엎어야 하면 임시로 바꾸되 커밋하지 말 것. (2026-06 5c3502a에 이어 두 번째 회귀)
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # spot.categories 등 @ElementCollection/연관 지연로딩 N+1 방지 (목록 조회 시 IN 절로 일괄 로딩)
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 2

weather:
  api:
    key: ${WEATHER_SERVICE_KEY}

tour:
  api:
    key: ${PUBLIC_DATA_SERVICE_KEY}

air:
  quality:
    key: ${PUBLIC_DATA_SERVICE_KEY}

kakao:
  rest:
    api:
      key: ${KAKAO_REST_API_KEY}
  auth:
    user-info-url: https://kapi.kakao.com/v2/user/me

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}


firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:classpath:firebase-key.json}

websocket:
  allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS}

cloud:
  aws:
    region: ${AWS_REGION}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES}
