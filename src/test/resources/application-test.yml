spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  
  # redis mock
  data:
    redis:
      host: localhost
      port: 6379

air:
  quality:
    key: "test-key"

tour:
  api:
    key: "test-key"

kakao:
  rest:
    api:
      key: "test-key"

weather:
  api:
    key: "test-key"

jwt:
  secret: "test-secret-test-secret-test-secret-test-secret"

websocket:
  allowed-origin-patterns: "http://localhost:3000,http://localhost:8081"

cloud:
  aws:
    region: us-east-1
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    s3:
      bucket: test-bucket
      presigned-url-expiration-minutes: 30

firebase:
  config:
    path: classpath:firebase-key.json
