spring:
  # 테스트는 H2로 돌지만 db/migration의 SQL은 MySQL 전용이다.
  # FULLTEXT ... WITH PARSER ngram, 생성 컬럼의 REGEXP_REPLACE 같은 문법이 H2에 없어
  # 켜두면 컨텍스트가 뜨다가 전부 실패한다.
  #
  # 테스트 스키마는 아래 ddl-auto: create-drop이 엔티티에서 만든다.
  # 마이그레이션 SQL 자체의 검증은 실제 MySQL에 적용해서 한다(H2로는 의미가 없다).
  flyway:
    enabled: false

  # data.sql은 ON DUPLICATE KEY UPDATE 등 MySQL 전용 구문이라 H2에서 깨진다. 테스트는 각자 데이터를 넣는다.
  sql:
    init:
      mode: never

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  
  # redis mock
  data:
    redis:
      host: localhost
      port: 6379

air:
  quality:
    key: "test-key"

tour:
  api:
    key: "test-key"

kakao:
  rest:
    api:
      key: "test-key"

weather:
  api:
    key: "test-key"

jwt:
  secret: "test-secret-test-secret-test-secret-test-secret"

websocket:
  allowed-origin-patterns: "http://localhost:3000,http://localhost:8081"

cloud:
  aws:
    region: us-east-1
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    s3:
      bucket: test-bucket
      presigned-url-expiration-minutes: 30

firebase:
  config:
    path: classpath:firebase-key.json
